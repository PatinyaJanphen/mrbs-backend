

services:
  # 1. Nginx Web Server
  webserver:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - saas-network

  # 2. Laravel Application (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: app
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=pgsql
      - REDIS_HOST=redis
    depends_on:
      - pgsql
      - redis
    networks:
      - saas-network

  # 3. PostgreSQL Database
  pgsql:
    image: postgres:15-alpine
    container_name: pgsql
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Bangkok
    volumes:
      - pgsql_data:/var/lib/postgresql/data
    networks:
      - saas-network

  # 4. Redis
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - saas-network

  # 5. Queue Worker
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name:  worker
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ./:/var/www/html
    environment:
      - DB_HOST=pgsql
      - REDIS_HOST=redis
    depends_on:
      - redis
      - pgsql
    networks:
      - saas-network

networks:
  saas-network:
    driver: bridge

volumes:
  pgsql_data:
  redis_data: