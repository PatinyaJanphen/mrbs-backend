server {
    # Listen for requests on port 80
    listen 80;
    listen [::]:80;
    
    # Set the root directory to the public folder of Laravel
    root /var/www/html/public;
    
    # Set the default file to be called
    index index.php index.html index.htm;

    # Prevent Nginx version from being displayed for security
    server_tokens off;

    # Handle Laravel Routes (if file not found, send to index.php)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # When a .php file is found, send it to PHP-FPM (Container named app) for processing
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        
        # The host name here must match the service name in docker-compose.yml (which is app)
        fastcgi_pass app:9000; 
        fastcgi_index index.php;
        
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Block access to hidden files (e.g., .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}