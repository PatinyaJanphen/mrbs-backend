databases:
  - name: mrbs-db
    databaseName: mrbs_db
    user: mrbs_user
    plan: free

envVarGroups:
  - name: mrbs-backend-common-env
    envVars:
      - key: APP_NAME
        value: MRBS
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      # ServerSideUp Laravel Automations
      - key: AUTORUN_ENABLED
        value: "true"
      - key: AUTORUN_LARAVEL_MIGRATION
        value: "true"
      - key: AUTORUN_LARAVEL_MIGRATION_FORCE
        value: "true"
      - key: AUTORUN_LARAVEL_STORAGE_LINK
        value: "true"
      - key: AUTORUN_LARAVEL_CONFIG_CACHE
        value: "true"
      - key: AUTORUN_LARAVEL_ROUTE_CACHE
        value: "true"
      - key: AUTORUN_LARAVEL_VIEW_CACHE
        value: "true"
      # Application Configuration (configured on Render dashboard)
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Google OAuth Credentials (configured on Render dashboard)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Mail Configuration (configured on Render dashboard)
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_ENCRYPTION
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: MRBS

services:
  # 1. Redis Key Value Store (Free Plan)
  - type: keyvalue
    name: mrbs-redis
    plan: free
    ipAllowList: [] # internal connections only

  # 2. Laravel Web Service (API Backend - Free Plan)
  - type: web
    name: mrbs-api
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    envVars:
      - fromGroup: mrbs-backend-common-env
      - key: DB_URL
        fromDatabase:
          name: mrbs-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mrbs-redis
          property: connectionString


